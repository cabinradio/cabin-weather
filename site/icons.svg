<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true" focusable="false">
<!-- Cabin Weather glyphs. One symbol per name in pipeline/icons.py GLYPHS, id cw-{name}.
     Line drawings only: 1.5px stroke, currentColor, round caps and joins, no fills, 24x24 box. -->
<defs>
<g id="cw-cloud-top" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14h11a3 3 0 0 0 0-6A4.5 4.5 0 0 0 8.5 9 3 3 0 0 0 6 14z"/></g>
<g id="cw-cloud-small" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19h9a3 3 0 0 0 0-6A4 4 0 0 0 10.5 11.8 3.75 3.75 0 0 0 9 19z"/></g>
</defs>
<symbol id="cw-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5V4M12 20v1.5M2.5 12H4M20 12h1.5M5.3 5.3l1 1M17.7 17.7l1 1M5.3 18.7l1-1M17.7 6.3l1-1"/></symbol>
<symbol id="cw-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 15a7.5 7.5 0 1 1-10-10 9 9 0 0 0 10 10z"/></symbol>
<symbol id="cw-part-cloud-day" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><path d="M8 2.5V4M2.5 8H4M4.1 4.1l1 1M4.1 11.9l1-1M11.9 4.1l-1 1M13 8h1.5"/><use href="#cw-cloud-small"/></symbol>
<symbol id="cw-part-cloud-night" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 8.5a4.5 4.5 0 1 1-6-6 5.5 5.5 0 0 0 6 6z"/><use href="#cw-cloud-small"/></symbol>
<symbol id="cw-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h13a4 4 0 0 0 0-8A5.5 5.5 0 0 0 7.5 9.5 4 4 0 0 0 5 17z"/></symbol>
<symbol id="cw-rain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><use href="#cw-cloud-top"/><path d="M9 17l-1 3.5M13 17l-1 3.5M17 17l-1 3.5"/></symbol>
<symbol id="cw-showers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><use href="#cw-cloud-top"/><path d="M10 17l-.7 2.5M14.5 17l-.7 2.5"/></symbol>
<symbol id="cw-snow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><use href="#cw-cloud-top"/><path d="M7.2 18.5h2.6M8.5 17.2v2.6M11.7 18.5h2.6M13 17.2v2.6M16.2 18.5h2.6M17.5 17.2v2.6"/></symbol>
<symbol id="cw-flurries" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><use href="#cw-cloud-top"/><path d="M9 18.5h2.4M10.2 17.3v2.4M13.6 18.5H16M14.8 17.3v2.4"/></symbol>
<symbol id="cw-freezing-rain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><use href="#cw-cloud-top"/><path d="M9.5 16.5l-.8 2.5M13.5 16.5l-.8 2.5M17.5 16.5l-.8 2.5M7 21.5h10"/></symbol>
<symbol id="cw-rain-snow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><use href="#cw-cloud-top"/><path d="M9.5 17l-1 3.5M13.8 18.5h2.6M15.1 17.2v2.6"/></symbol>
<symbol id="cw-thunder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><use href="#cw-cloud-top"/><path d="M12.8 15l-2.3 3.5h3l-2.3 3.5"/></symbol>
<symbol id="cw-fog" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><use href="#cw-cloud-top"/><path d="M5 17.5h14M7 21h10"/></symbol>
<symbol id="cw-blowing-snow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h9M3 14h7M5 19h6M16.6 8.5h2.8M18 7.1v2.8M14.6 15.5h2.8M16 14.1v2.8M18.6 19.5h2.8M20 18.1v2.8"/></symbol>
<symbol id="cw-wind" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h9.5a2 2 0 1 0-2-2M3 12.5h14a2.5 2.5 0 1 1-2.5 2.5M3 17h7.5a2 2 0 1 1-2 2"/></symbol>
<symbol id="cw-ice-crystals" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5v15M5.5 8.25l13 7.5M5.5 15.75l13-7.5M10.5 6l1.5 1.5L13.5 6M10.5 18l1.5-1.5 1.5 1.5M6 11l1.8.9L6.1 13M18 11l-1.8.9 1.7 1.1"/></symbol>
<symbol id="cw-haze" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 10a3.5 3.5 0 0 1 7 0M12 3.5V5M5.5 10H7M17 10h1.5M7.4 5.4l1 1M16.6 5.4l-1 1M4 13.5h16M6 17h12M8 20.5h8"/></symbol>
<symbol id="cw-hail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><use href="#cw-cloud-top"/><circle cx="9" cy="18.5" r="1.2"/><circle cx="13" cy="19.5" r="1.2"/><circle cx="17" cy="18.5" r="1.2"/></symbol>
<symbol id="cw-drizzle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><use href="#cw-cloud-top"/><path d="M9.5 17.5h.01M13 19.5h.01M16.5 17.5h.01M11.2 20.5h.01M14.8 21.5h.01"/></symbol>
<symbol id="cw-na" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12h8"/></symbol>
</svg>
