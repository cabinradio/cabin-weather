# Twice daily, after ECCC's overnight archive update: re-pull the last 10 days of the climate archive,
# refresh the LTCE records, rebuild the history files, commit them to main, then deploy.
name: Refresh climate archive

on:
  schedule:
    - cron: "10 9,15 * * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHONTZPATH: ""
  PYTHONUNBUFFERED: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Update the daily archive (last 10 days, with bulk-CSV fallback)
        run: python pipeline/fetch_climate.py
      - name: Update the LTCE daily records
        run: python pipeline/fetch_ltce.py
      - name: Rebuild the history files
        run: python pipeline/derive.py
      - name: Validate the history files
        run: python pipeline/validate.py data/history/*.json
      - name: Commit archive and history changes
        run: |
          git config user.name "cabin-weather-bot"
          git config user.email "noreply@cabinradio.ca"
          git add archive data/history
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Update climate archive and history for $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin main
          fi

  deploy:
    needs: update
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
