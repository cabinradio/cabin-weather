# Builds the Pages artifact (site/ + committed data/ + fresh current and forecast JSON) and deploys it.
# Called by refresh-current.yml and refresh-climate.yml. Always deploys the tip of main.
name: Deploy to Pages

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PYTHONTZPATH: ""          # use the pinned tzdata package, not the runner's system zoneinfo
  PYTHONUNBUFFERED: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Concurrency lives in the calling workflows (group "pages"); declaring it here too deadlocks the run.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Fetch current conditions and forecasts
        run: python pipeline/fetch_citypage.py
      - name: Validate every data file
        run: python pipeline/validate.py
      - name: Assemble the site
        run: |
          mkdir -p _site/data
          cp -R site/. _site/
          cp -R data/. _site/data/
          touch _site/.nojekyll
          du -sh _site && find _site -type f | wc -l
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
